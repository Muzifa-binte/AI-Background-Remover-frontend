<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8336d" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#2fbfb0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern App Icon Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGradient)" filter="url(#shadow)" />

  <!-- Checkerboard grid subtle overlay -->
  <rect x="12" y="12" width="10" height="10" rx="2" fill="#ffffff" fill-opacity="0.15" />
  <rect x="22" y="22" width="10" height="10" rx="2" fill="#ffffff" fill-opacity="0.15" />
  <rect x="32" y="12" width="10" height="10" rx="2" fill="#ffffff" fill-opacity="0.15" />
  <rect x="42" y="22" width="10" height="10" rx="2" fill="#ffffff" fill-opacity="0.15" />

  <!-- Magic Cutout & Scissors Icon -->
  <g transform="translate(10, 10)" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="9" cy="9" r="4.2" fill="#ffffff" fill-opacity="0.2" />
    <circle cx="9" cy="35" r="4.2" fill="#ffffff" fill-opacity="0.2" />
    <path d="M12.5 12.5 L35 33" stroke="#ffffff" />
    <path d="M12.5 31.5 L35 11" stroke="#ffffff" />
    <circle cx="22" cy="22" r="2.2" fill="#ffffff" stroke="none" />
    
    <!-- AI Sparkle -->
    <path d="M37 17 L38.5 21 L42.5 22.5 L38.5 24 L37 28 L35.5 24 L31.5 22.5 L35.5 21 Z" fill="#ffffff" stroke="none" />
  </g>
</svg>
